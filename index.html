<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCOS SHOT</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f10;
  --surface:#1a1a1e;
  --border:#2e2e38;
  --accent:#c8f53a;
  --accent-dim:#8fb029;
  --red:#f53a3a;
  --red-dim:#a01010;
  --blue:#3ab4f5;
  --text:#e8e8e0;
  --text-muted:#666672;
  --tile:40px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',monospace;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ── HUD ── */
#hud{
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  display:flex;
  align-items:center;
  gap:20px;
  flex-shrink:0;
  z-index:20;
}
#hud h1{
  font-family:'Syne',sans-serif;
  font-size:17px;
  font-weight:800;
  color:var(--accent);
  letter-spacing:-0.02em;
  white-space:nowrap;
}
.bar-wrap{display:flex;flex-direction:column;gap:3px}
.bar-label{font-size:9px;letter-spacing:.1em;color:var(--text-muted);text-transform:uppercase}
.bar{width:120px;height:10px;background:var(--border);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .2s}
#hp-fill{background:var(--accent)}
#xp-fill{background:var(--blue)}
.stat{font-size:12px;color:var(--text-muted)}
.stat span{color:var(--text);font-weight:500}
#level-tag{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:20px;
  color:var(--accent);
  margin-left:auto;
}
#kbd-hint{
  font-size:10px;
  color:var(--text-muted);
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;
}
kbd{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:3px;
  padding:1px 6px;
  font-size:10px;
  font-family:'DM Mono',monospace;
  color:var(--accent);
}

/* ── ARENA ── */
#arena{
  position:relative;
  flex:1;
  overflow:hidden;
  background:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:var(--tile) var(--tile);
  background-color:var(--bg);
}

/* ── ENTITIES ── */
.entity{
  position:absolute;
  width:38px;height:38px;
  border-radius:8px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:9px;font-weight:500;
  border:2px solid transparent;
  pointer-events:none;
  z-index:5;
}
.entity .ico{font-size:18px;line-height:1}
.entity .etag{font-size:8px;letter-spacing:.06em;opacity:.7;text-transform:uppercase}

#player{
  background:#1e2d0f;
  color:var(--accent);
  border-color:var(--accent-dim);
  z-index:10;
  transition:none;
}
#player.hit{border-color:var(--red)!important;background:#2d0f0f}

.enemy{
  background:#2d0f0f;
  color:var(--red);
  border-color:var(--red-dim);
}
.enemy.aggro{border-color:var(--red)!important}
.enemy.dead{opacity:0;transform:scale(.5);transition:opacity .3s,transform .3s}

/* ── ENEMY HP BAR ── */
.ebar-wrap{
  position:absolute;
  top:-8px;left:50%;
  transform:translateX(-50%);
  width:36px;height:4px;
  background:var(--border);
  border-radius:2px;overflow:hidden;
}
.ebar-fill{height:100%;background:var(--red);border-radius:2px;transition:width .15s}

/* ── BULLETS ── */
.bullet{
  position:absolute;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--accent);
  z-index:8;
  pointer-events:none;
}
.bullet.enemy-bullet{background:var(--red)}

/* ── FLOATERS ── */
.floater{
  position:absolute;
  font-size:13px;font-weight:700;
  pointer-events:none;
  z-index:30;
  animation:float-up .9s ease-out forwards;
}
@keyframes float-up{
  0%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-36px) scale(.8)}
}

/* ── LOG ── */
#log{
  position:absolute;
  bottom:8px;left:8px;
  width:260px;
  background:rgba(15,15,16,.85);
  border:1px solid var(--border);
  border-radius:6px;
  padding:6px 10px;
  font-size:10px;
  line-height:1.7;
  color:var(--text-muted);
  pointer-events:none;
  z-index:20;
  max-height:90px;
  overflow:hidden;
  display:flex;flex-direction:column;
}
.log-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-line.accent{color:var(--accent)}
.log-line.danger{color:var(--red)}
.log-line.info{color:var(--blue)}
.log-line.gold{color:#f5c842}

/* ── OVERLAY ── */
#overlay{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(15,15,16,.92);
  z-index:50;
  gap:16px;
}
#overlay.show{display:flex}
#overlay h2{
  font-family:'Syne',sans-serif;
  font-size:42px;font-weight:800;
  letter-spacing:-.03em;
}
#overlay.gameover h2{color:var(--red)}
#overlay.win h2{color:var(--accent)}
#overlay p{font-size:13px;color:var(--text-muted)}
#overlay button{
  margin-top:8px;
  background:transparent;
  border:1px solid var(--accent);
  color:var(--accent);
  padding:8px 24px;
  font-family:'DM Mono',monospace;
  font-size:13px;
  border-radius:5px;
  cursor:pointer;
  transition:background .15s;
}
#overlay button:hover{background:rgba(200,245,58,.1)}

/* ── WAVE TAG ── */
#wave-tag{
  position:absolute;
  top:12px;right:12px;
  font-family:'Syne',sans-serif;
  font-size:13px;font-weight:800;
  color:var(--text-muted);
  z-index:20;
}

/* ── BOSS HUD ── */
#boss-hud{
  position:absolute;
  top:20px;left:50%;
  transform:translateX(-50%);
  width:60%;max-width:600px;
  display:none;
  flex-direction:column;
  gap:5px;
  z-index:25;
  animation:fadeIn .5s ease-out;
}
#boss-name{
  font-family:'Syne',sans-serif;
  font-size:12px;font-weight:800;
  color:var(--red);
  letter-spacing:.15em;text-transform:uppercase;
  text-shadow:0 0 8px rgba(245,58,58,.4);
}
.boss-bar{
  width:100%;height:8px;
  background:rgba(46,46,56,.6);
  border:1px solid var(--border);
  border-radius:2px;overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
}
#boss-hp-fill{
  width:100%;height:100%;
  background:linear-gradient(90deg,var(--red-dim),var(--red));
  border-radius:2px;
  transition:width .1s ease-out;
}
@keyframes fadeIn{
  from{opacity:0;transform:translate(-50%,-10px)}
  to{opacity:1;transform:translate(-50%,0)}
}

/* ── RONALDO ── */
.enemy.ronaldo-boss{background:#1a0f2e;color:#f5c842;border-color:#a855f7}
.enemy.ronaldo-boss.aggro{border-color:#f5c842!important}
.enemy.ronaldo-dashing{border-color:#f5c842!important;background:#2d1f00!important}
.ebar-fill.boss-bar-fill{background:#f5c842}
#boss-name.ronaldo-name{color:#f5c842;text-shadow:0 0 8px rgba(245,200,66,.5)}
#boss-hp-fill.ronaldo-fill{background:linear-gradient(90deg,#a855f7,#f5c842)}
.bullet.ronaldo-bullet{background:#f5c842;width:9px;height:9px}
.dash-trail{
  position:absolute;
  width:34px;height:34px;
  border-radius:8px;
  background:rgba(245,200,66,.18);
  border:1px solid rgba(245,200,66,.35);
  pointer-events:none;
  z-index:4;
  animation:trail-fade .35s ease-out forwards;
}
@keyframes trail-fade{
  0%{opacity:.8}
  100%{opacity:0;transform:scale(.5)}
}
/* Laser de aviso */
.laser-warn {
  position: absolute;
  height: 3px;
  margin-top: -1.5px;
  background: rgba(255, 80, 60, 0.3);
  border-top: 1px dashed rgba(255, 80, 60, 0.7);
  border-bottom: 1px dashed rgba(255, 80, 60, 0.7);
  pointer-events: none;
  z-index: 1;
  transition: height 0.08s, background 0.08s;
}
/* Laser ativo */
.laser-active {
  position: absolute;
  height: 14px;
  margin-top: -7px;
  background: rgba(255, 40, 30, 0.92);
  box-shadow: 0 0 18px 6px rgba(255, 50, 30, 0.55);
  pointer-events: none;
  z-index: 1;
}
/* Variante Ronaldo — dourado */
.laser-warn.laser-ronaldo {
  background: rgba(245, 200, 66, 0.25);
  border-top: 1px dashed rgba(245, 200, 66, 0.75);
  border-bottom: 1px dashed rgba(245, 200, 66, 0.75);
}
.laser-active.laser-ronaldo {
  background: rgba(245, 200, 66, 0.95);
  box-shadow: 0 0 22px 8px rgba(245, 200, 66, 0.5);
}
</style>
</head>
<body>
<audio id="Normal-Music" loop style="display: none;">
  <source src="https://dn711105.ca.archive.org/0/items/jamendo-461421/01-1899051-niyolshin-Chillout%20Cafe%20Lo-fi%20_Lo%20Fi%2C%20Hip%20Hop%2C%20Chill%20Out_.mp3" type="audio/mpeg">
</audio>
<audio id="Boss-Music" loop style="display: none;">
  <source src="https://dn710606.ca.archive.org/0/items/mega-man-iii-mega-man-3-boss-battle-capcom-1992-gb/%C2%ABMega%20Man%20III%C2%BB%20-%20Mega%20Man%203%20Boss%20Battle%20%28Capcom%2C1992%2CGB%29%20.mp3" type="audio/mpeg">
</audio>

<!-- MENU -->
<div id="menu" style="position:fixed;inset:0;background:#0f0f10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:100">
  <h1 style="font-family:'Syne',sans-serif;font-size:48px;font-weight:800;color:#c8f53a;letter-spacing:-.03em">BLOCOS SHOT</h1>
  <p style="font-size:11px;color:#666672;letter-spacing:.1em">SELECIONE O MODO</p>
  <button onclick="startGame('normal')" style="width:260px;padding:12px;background:transparent;border:1px solid #c8f53a;color:#c8f53a;font-family:'DM Mono',monospace;font-size:14px;border-radius:5px;cursor:pointer">▶ NORMAL — 15 ondas</button>
  <button onclick="startGame('bossrush')" style="width:260px;padding:12px;background:transparent;border:1px solid #f53a3a;color:#f53a3a;font-family:'DM Mono',monospace;font-size:14px;border-radius:5px;cursor:pointer">💀 BOSS RUSH — só bosses</button>
</div>

<!-- HUD -->
<div id="hud">
  <h1>BLOCOS SHOT</h1>
  <div class="bar-wrap">
    <div class="bar-label">HP</div>
    <div class="bar"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
  </div>
  <div class="bar-wrap">
    <div class="bar-label">XP</div>
    <div class="bar"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div>
  </div>
  <div class="stat">HP <span id="hp-val">100</span></div>
  <div class="stat">ATK <span id="atk-val">20</span></div>
  <div class="stat">kills <span id="kill-val">0</span></div>
  <div id="level-tag">Lv.1</div>
  <div id="kbd-hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> mover
    &nbsp;<kbd>Espaço</kbd> atacar
    &nbsp;<kbd>Shift</kbd> dash
  </div>
</div>

<!-- ARENA -->
<div id="arena">
  <div id="boss-hud">
    <div id="boss-name"></div>
    <div class="boss-bar"><div id="boss-hp-fill"></div></div>
  </div>
  <div id="player" class="entity">
    <div class="ico">&#9632;</div>
    <div class="etag">YOU</div>
  </div>
  <div id="log"></div>
  <div id="wave-tag">WAVE 0</div>
  <div id="overlay">
    <h2 id="overlay-title">GAME OVER</h2>
    <p id="overlay-sub"></p>
    <button onclick="restartGame()">&#9654; jogar de novo</button>
    <button onclick="voltarMenu()">&#9654; voltar ao menu</button>
  </div>
</div>

<script>
// CONSTANTS
const ETYPES = [
  { tag:'Makako', ico:'▲',  hp:40,   atk:10,  spd:1.1, xp:15,   size:38 },
  { tag:'Bruto',  ico:'◆',  hp:100,  atk:25,  spd:0.7, xp:35,   size:42 },
  { tag:'Gnomo',  ico:'▶',  hp:25,   atk:15,  spd:2.0, xp:20,   size:32 },
  { tag:'Gandalf',ico:'✦',  hp:55,   atk:20,  spd:0.9, xp:30,   size:36, shoots:true },
  { tag:'VORTEX', ico:'🌀', hp:600,  atk:10,  spd:0.8, xp:200,  size:64 },
  { tag:'VOID',   ico:'🌌', hp:800,  atk:50, spd:1.5,   xp:999,  size:70 },
  { tag:'RONALDO',ico:'🗡️', hp:1500,  atk:60,  spd:1,   xp:1500, size:68 },
];

const BOSS_WAVES   = { 5: 4, 10: 5, 15: 6 };
const BOSSRUSH_MAP = { 1: 4,  2: 5,  3: 6 };
const BOSS_NAMES   = { 4: 'VORTEX', 5: 'VOID', 6: '⚽ RONALDO ⚽' };
const MAX_WAVES    = { normal: 15, bossrush: 3 };

// DOM REFS
const arena       = document.getElementById('arena');
const playerEl    = document.getElementById('player');
const hpFill      = document.getElementById('hp-fill');
const xpFill      = document.getElementById('xp-fill');
const hpVal       = document.getElementById('hp-val');
const atkVal      = document.getElementById('atk-val');
const killVal     = document.getElementById('kill-val');
const levelTag    = document.getElementById('level-tag');
const overlay     = document.getElementById('overlay');
const overlayTitle= document.getElementById('overlay-title');
const overlaySub  = document.getElementById('overlay-sub');
const waveTag     = document.getElementById('wave-tag');
const logEl       = document.getElementById('log');
const bossHud     = document.getElementById('boss-hud');
const bossHpFill  = document.getElementById('boss-hp-fill');
const bossNameEl  = document.getElementById('boss-name');
const musicaNormal  = document.getElementById('Normal-Music');
const musicaBoss     = document.getElementById('Boss-Music');
const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);


// GAME STATE
let P, enemies = [], bullets = [], keys = {};
let gameRunning = false, animId, lastTime = 0;
let waveNum = 0, waveClear = false, bossSpawning = false;
let activeBoss = null, gameMode = 'normal';
const logLines = [];
let musicaAtual = null;

function alternarMusica(novaMusica) {
  if (musicaAtual === novaMusica) return;

  if (musicaAtual) {
    musicaAtual.pause();
    musicaAtual.currentTime = 0; 
    }

  musicaAtual = novaMusica;
  musicaAtual.play().catch(e => {
  console.log("Aguardando clique do usuário para iniciar o som.");
  });
  }

// Jogador
function initPlayer() {
  const { width, height } = arena.getBoundingClientRect();
  P = {
    x: width / 2 - 19, y: height / 2 - 19,
    hp: 100, maxHp: 100,
    atk: 20, speed: 3.2,
    xp: 0, xpNext: 60,
    level: 1, kills: 0,
    shootCd: 0, dashCd: 0, invincible: 0,
  };
}

function updatePlayer(dt) {
  const dtf = dt * 0.06;
  let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft']  ? 1 : 0);
  let dy = (keys['s'] || keys['arrowdown']  ? 1 : 0) - (keys['w'] || keys['arrowup']    ? 1 : 0);
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    P.x += dx / len * P.speed * dtf;
    P.y += dy / len * P.speed * dtf;
  }
  clampPos(P, 38);
  playerEl.style.left = P.x + 'px';
  playerEl.style.top  = P.y + 'px';
  if (P.shootCd   > 0) P.shootCd   -= dtf;
  if (P.dashCd    > 0) P.dashCd    -= dtf;
  if (P.invincible> 0) P.invincible -= dtf;
}

function playerShoot() {
  if (P.shootCd > 0 || !gameRunning) return;
  let nearest = null, bestDist = Infinity;
  for (const e of enemies) {
    if (!e.alive) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y);
    if (d < bestDist) { bestDist = d; nearest = e; }
  }
  if (!nearest) return;
  const dx = nearest.x - P.x, dy = nearest.y - P.y;
  const len = Math.hypot(dx, dy) || 1;
  spawnBullet(P.x + 15, P.y + 15, dx / len * 7, dy / len * 7, false);
  P.shootCd = 18;
}

function playerDash() {
  if (P.dashCd > 0 || !gameRunning) return;
  let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft']  ? 1 : 0);
  let dy = (keys['s'] || keys['arrowdown']  ? 1 : 0) - (keys['w'] || keys['arrowup']    ? 1 : 0);
  if (!dx && !dy) dy = -1;
  const len = Math.hypot(dx, dy) || 1;
  P.x += dx / len * 80;
  P.y += dy / len * 80;
  P.invincible = 18;
  P.dashCd = 60;
  addLog('dash!', 'accent');
}

function gainXp(amount) {
  P.xp += amount;
  while (P.xp >= P.xpNext) {
    P.xp -= P.xpNext;
    P.level++;
    P.xpNext  = Math.floor(P.xpNext * 1.5);
    P.atk    += 8;
    P.maxHp  += 30;
    P.hp      = Math.min(P.hp + 40, P.maxHp);
    P.speed  += 0.2;
    levelTag.textContent = 'Lv.' + P.level;
    atkVal.textContent   = P.atk;
    addLog(`level up! → Lv.${P.level} atk+8`, 'accent');
    floater(P.x, P.y - 10, 'LEVEL UP!', 'var(--accent)');
  }
}

// Os da Arabia Saudita são muito rápidos, tem que ser assim
function spawnEnemy(typeIdx) {
  const { width, height } = arena.getBoundingClientRect();
  const t     = ETYPES[typeIdx];
  const isBoss = ['VORTEX', 'VOID', 'RONALDO'].includes(t.tag);
  const scale  = 1 + (waveNum - 1) * 0.3;

  let x, y;
  if (isBoss) {
    x = width  / 2 - t.size / 2;
    y = height / 2 - t.size / 2;
  } else {
    const edge = Math.floor(Math.random() * 4);
    if      (edge === 0) { x = Math.random() * width;  y = -48; }
    else if (edge === 1) { x = width + 8;               y = Math.random() * height; }
    else if (edge === 2) { x = Math.random() * width;  y = height + 8; }
    else                 { x = -48;                     y = Math.random() * height; }
  }

  const el = document.createElement('div');
  el.className = 'entity enemy' + (t.tag === 'RONALDO' ? ' ronaldo-boss' : '');
  el.style.cssText = `width:${t.size}px;height:${t.size}px`;
  el.innerHTML = `<div class="ico" style="font-size:${t.tag === 'RONALDO' ? 28 : 18}px">${t.ico}</div><div class="etag">${t.tag}</div>`;

  const ebarFill = document.createElement('div');
  ebarFill.className = 'ebar-fill' + (t.tag === 'RONALDO' ? ' boss-bar-fill' : '');
  const ebar = document.createElement('div');
  ebar.className = 'ebar-wrap';
  ebar.appendChild(ebarFill);
  el.appendChild(ebar);
  arena.appendChild(el);

  const e = {
    el, ebarFill, x, y, tag: t.tag, size: t.size,
    hp: Math.floor(t.hp * scale), maxHp: Math.floor(t.hp * scale),
    atk: Math.floor(t.atk * scale), spd: t.spd, xp: t.xp,
    shoots: t.shoots || false,
    shootCd: 0, hitCd: 0, aggro: false, alive: true,
    angleOffset: 0, teleportCd: 180,
    // Ronaldo-specific
    dashState: 'idle', dashCooldown: 30,
    dashVx: 0, dashVy: 0, dashDuration: 0, dashMaxDuration: 0,
    trailCd: 0, spiralFired: false,
  };
  enemies.push(e);
  return e;
}

function killEnemy(e) {
  e.alive = false;
  e.el.classList.add('dead');
  setTimeout(() => e.el.remove(), 400);
  if (activeBoss && e === activeBoss) {
    bossHud.style.display = 'none';
    activeBoss = null;
    alternarMusica(musicaNormal);
  }
  P.kills++;
  gainXp(e.xp);
  killVal.textContent = P.kills;
  addLog(`${e.tag} derrotado +${e.xp}xp`, 'accent');
  updateHud();
}

function updateEnemies(dt) {
  const { width, height } = arena.getBoundingClientRect();
  for (const e of enemies) {
    if (!e.alive) continue;
    const dtf = dt * 0.06;
    if (e.hitCd > 0) e.hitCd -= dtf;

    const edx  = P.x - e.x, edy = P.y - e.y;
    const elen  = Math.hypot(edx, edy) || 1;
    const dist  = elen;

    // Movimento
    if (e.tag === 'RONALDO') {
      updateRonaldo(e, dt);
    } else {
      e.x += edx / elen * e.spd * dtf;
      e.y += edy / elen * e.spd * dtf;
    }

    // Podersinho foda do VORTEX
    if (e.tag === 'VORTEX' && dist < 500) {
      P.x -= edx / elen * 0.55;
      P.y -= edy / elen * 0.55;
    }
    if (e.tag === 'VOID') {
      e.teleportCd -= dtf;
      if (e.teleportCd <= 0) {
        floater(e.x + e.size / 2, e.y, 'BUG', 'var(--red)');
        e.x = Math.random() * (width  - e.size);
        e.y = Math.random() * (height - e.size);
        e.teleportCd = 140;
      }
    }

    e.el.style.left = e.x + 'px';
    e.el.style.top  = e.y + 'px';

    if (dist < 280 && !e.aggro) { e.aggro = true; e.el.classList.add('aggro'); }

    enemyShoot(e, dt);

    // Melee contact
    if (P.invincible <= 0 && dist < e.size / 2 + 15 && e.hitCd <= 0) {
      P.hp -= Math.floor(e.atk);
      P.invincible = 30; e.hitCd = 40;
      floater(P.x, P.y - 10, '-' + e.atk, 'var(--red)');
      playerEl.classList.add('hit');
      setTimeout(() => playerEl.classList.remove('hit'), 200);
      if (P.hp <= 0) { endGame(false); return; }
      updateHud();
    }
  }
}

// ── Padrões de tiro inimigo ──────────────────────────────────────────────────
function BalaUnica(cx, cy, dmg, speed = 4.5, isRonaldo = false) {
  const dx = P.x - cx, dy = P.y - cy;
  const len = Math.hypot(dx, dy) || 1;
  spawnBullet(cx, cy, dx / len * speed, dy / len * speed, true, dmg, isRonaldo);
}

function AnelDeBala(cx, cy, dmg, count = 12, speed = 6.2, isRonaldo = false) {
  for (let i = 0; i < count; i++) {
    const a = i * Math.PI * 2 / count;
    spawnBullet(cx, cy, Math.cos(a) * speed, Math.sin(a) * speed, true, dmg, isRonaldo);
  }
}

function BalaSpiral(cx, cy, angleOffset, dmg, arms = 5, speed = 4.8, isRonaldo = false) {
  for (let i = 0; i < arms; i++) {
    const a = angleOffset + i * Math.PI * 2 / arms;
    spawnBullet(cx, cy, Math.cos(a) * speed, Math.sin(a) * speed, true, dmg, isRonaldo);
  }
}

function BalaTripla(cx, cy, dmg, speed = 8.5, delay = 150) {
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      if (!gameRunning) return;
      const dx = P.x - cx, dy = P.y - cy;
      const len = Math.hypot(dx, dy) || 1;
      spawnBullet(cx, cy, dx / len * speed, dy / len * speed, true, dmg);
    }, i * delay);
  }
}

function Laser(cx, cy, dmg, tempo, isRonaldo = false) {
  const { width, height } = arena.getBoundingClientRect();
  const diagonal = Math.ceil(Math.hypot(width, height));

  // Aponta para o jogador NO MOMENTO do aviso (para dar chance de desviar)
  const angle = Math.atan2((P.y + 19) - cy, (P.x + 19) - cx);

  // Elemento do laser (nasce como aviso, vira ativo depois)
  const el = document.createElement('div');
  el.className = 'laser-warn' + (isRonaldo ? ' laser-ronaldo' : '');
  el.style.cssText = `
    left:${cx - diagonal}px;
    top:${cy}px;
    width:${diagonal * 2}px;
    transform-origin:${diagonal}px center;
    transform:rotate(${angle}rad);
  `;
  arena.appendChild(el);

  // Pisca durante o aviso para chamar atenção do jogador
  const flashes = Math.max(4, Math.floor(tempo / 120));
  let tick = 0;
  const blink = setInterval(() => {
    if (!el.parentNode) { clearInterval(blink); return; }
    el.style.opacity = (tick++ % 2 === 0) ? '0.25' : '1';
  }, tempo / flashes);

  setTimeout(() => {
    if (!gameRunning) { clearInterval(blink); el.remove(); return; }
    clearInterval(blink);

    el.className = 'laser-active' + (isRonaldo ? ' laser-ronaldo' : '');
    el.style.opacity = '1';

    const pcx = P.x + 19, pcy = P.y + 19;
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const perp = Math.abs((pcx - cx) * sin - (pcy - cy) * cos);

    if (perp < 20 && P.invincible <= 0) {
      P.hp -= Math.floor(dmg);
      P.invincible = 25;
      floater(P.x, P.y - 12, `-${dmg} LASER`, 'var(--red)');
      playerEl.classList.add('hit');
      setTimeout(() => playerEl.classList.remove('hit'), 200);
      if (P.hp <= 0) { endGame(false); return; }
      updateHud();
    }

    // Remove o laser após a animação ativa
    setTimeout(() => el.remove(), 380);
  }, tempo);
}


function enemyShoot(e, dt) {
  if (e.tag === 'RONALDO') return;
  e.shootCd -= dt * 0.06;
  if (e.shootCd > 0) return;

  const cx = e.x + e.size / 2 - 4;
  const cy = e.y + e.size / 2 - 4;

  if (e.shoots) {                    
    BalaUnica(cx, cy, e.atk);
    e.shootCd = 70;

  } else if (e.tag === 'VORTEX') {   
    e.angleOffset += 0.25;
    Laser(cx, cy, e.atk * 1.2, 1000);
    BalaSpiral(cx, cy, e.angleOffset, e.atk);
    e.shootCd = 10;

  } else if (e.tag === 'VOID') {     
    if (Math.random() < 0.5) {
      AnelDeBala(cx, cy, e.atk);
      e.shootCd = 40;
    } else {
      BalaTripla(cx, cy, e.atk);
      e.shootCd = 60;
    }
  }
}

// RONALDO IA - kkkkkkk toma no cu
function updateRonaldo(e, dt) {
  const { width, height } = arena.getBoundingClientRect();
  const dtf = dt * 0.06;
  e.dashCooldown -= dtf;
  e.trailCd      -= dtf;

  if (e.dashState === 'idle') {
    if (e.dashCooldown <= 0) {
      
      const tdx = (P.x + 19) - (e.x + e.size / 2);
      const tdy = (P.y + 19) - (e.y + e.size / 2);
      const tlen = Math.hypot(tdx, tdy) || 1;
      e.dashVx = tdx / tlen * 30;
      e.dashVy = tdy / tlen * 30;
      e.dashDuration = 0; e.dashMaxDuration = 80;
      e.dashState = 'dashing'; e.spiralFired = false;
      e.el.classList.add('ronaldo-dashing');
      floater(e.x + e.size / 2, e.y, 'DASH!', '#f5c842');
    } else {
      
      const sdx = (P.x + 19) - (e.x + e.size / 2);
      const sdy = (P.y + 19) - (e.y + e.size / 2);
      const slen = Math.hypot(sdx, sdy) || 1;
      e.x += sdx / slen * 0.8 * dtf;
      e.y += sdy / slen * 0.8 * dtf;
    }
  }

  if (e.dashState === 'dashing') {
    const ease = 1 - e.dashDuration / e.dashMaxDuration;
    e.x += e.dashVx * ease * dtf;
    e.y += e.dashVy * ease * dtf;
    e.dashDuration += dtf;

    if (e.trailCd <= 0) {
      spawnTrail(e.x + (e.size - 34) / 2, e.y + (e.size - 34) / 2);
      e.trailCd = 3;
    }

    // Pre-dash spiral
    if (!e.spiralFired && e.dashDuration >= 3) {
      ronaldoSpiralBlast(e);
      floater(e.x + e.size / 2, e.y, 'SPIRAL!', '#f5c842');
      addLog('Ronaldo — PRE-DASH SPIRAL!', 'gold');
      e.spiralFired = true;
    }

    if (e.dashDuration) {
       Laser(e.x + e.size / 2, e.y + e.size / 2, e.atk * 1.5, 1000, true);
    }

    const hitWall = e.x <= 2 || e.x >= width - e.size - 2 || e.y <= 2 || e.y >= height - e.size - 2;
    if (hitWall || e.dashDuration >= e.dashMaxDuration) {
      e.x = Math.max(2, Math.min(width  - e.size - 2, e.x));
      e.y = Math.max(2, Math.min(height - e.size - 2, e.y));
      e.dashState = 'recovering'; e.dashCooldown = 90;
      e.el.classList.remove('ronaldo-dashing');
      // Wall spiral
      ronaldoSpiralBlast(e);
      floater(e.x + e.size / 2, e.y, 'SPIRAL!', '#f5c842');
      addLog('Ronaldo — WALL SPIRAL!', 'gold');
    }
  }

  if (e.dashState === 'recovering' && e.dashCooldown <= 0) {
    e.dashState = 'idle';
    e.dashCooldown = 55 + Math.random() * 30;
  }
}

function ronaldoSpiralBlast(e) {
  const cx = e.x + e.size / 2 - 4;
  const cy = e.y + e.size / 2 - 4;
  for (let s = 0; s < 2; s++) {
    const offset = s * (Math.PI / 12);
    for (let i = 0; i < 12; i++) {
      const a = offset + i * Math.PI * 2 / 12;
      spawnBullet(cx, cy, Math.cos(a) * 4.5, Math.sin(a) * 4.5, true, e.atk, true);
    }
  }
}

function spawnTrail(x, y) {
  const el = document.createElement('div');
  el.className = 'dash-trail';
  el.style.cssText = `left:${x}px;top:${y}px`;
  arena.appendChild(el);
  setTimeout(() => el.remove(), 550);
}

// Bolitas
function spawnBullet(x, y, dx, dy, fromEnemy = false, dmg = 20, isRonaldo = false) {
  const el = document.createElement('div');
  el.className = 'bullet' + (fromEnemy ? ' enemy-bullet' : '') + (isRonaldo ? ' ronaldo-bullet' : '');
  el.style.cssText = `left:${x}px;top:${y}px`;
  arena.appendChild(el);
  bullets.push({ el, x, y, dx, dy, fromEnemy, dmg, alive: true });
}

function updateBullets(dt) {
  const { width, height } = arena.getBoundingClientRect();
  const dtf = dt * 0.06;

  for (const b of bullets) {
    if (!b.alive) continue;
    b.x += b.dx * dtf;
    b.y += b.dy * dtf;
    b.el.style.left = b.x + 'px';
    b.el.style.top  = b.y + 'px';

    // Remover balas fora da arena
    if (b.x < -30 || b.x > width + 30 || b.y < -30 || b.y > height + 30) {
      b.alive = false; b.el.remove(); continue;
    }

    if (!b.fromEnemy) {
      // Colisão de bala do jogador vs inimigos
      for (const e of enemies) {
        if (!e.alive) continue;
        if (b.x > e.x && b.x < e.x + e.size && b.y > e.y && b.y < e.y + e.size) {
          const dmg = P.atk + Math.floor(Math.random() * 8);
          e.hp -= dmg;
          floater(e.x, e.y - 8, '-' + dmg, 'var(--accent)');
          e.ebarFill.style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
          if (activeBoss && e === activeBoss)
            bossHpFill.style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
          b.alive = false; b.el.remove();
          if (e.hp <= 0) killEnemy(e);
          break;
        }
      }
    } else if (P.invincible <= 0) {
      // Colisão de bala inimiga  vs player
      if (b.x > P.x && b.x < P.x + 38 && b.y > P.y && b.y < P.y + 38) {
        const dmg = Math.floor((b.dmg || 20) + Math.random() * 8);
        P.hp -= Math.floor(dmg); P.invincible = 15;
        floater(P.x, P.y - 10, '-' + dmg, 'var(--red)');
        playerEl.classList.add('hit');
        setTimeout(() => playerEl.classList.remove('hit'), 150);
        b.alive = false; b.el.remove();
        if (P.hp <= 0) { endGame(false); return; }
        updateHud();
      }
    }
  }
}

// WAVES
function spawnWave(num) {
  waveTag.textContent = 'WAVE ' + num;
  waveClear = false;

  if (gameMode === 'bossrush') {
    const bossIdx = BOSSRUSH_MAP[num];
    if (!bossIdx) { endGame(true); return; }
    addLog(`— boss ${num}/3 —`, 'danger');
    bossSpawning = true;
    alternarMusica(musicaBoss);
    setTimeout(() => {
      if (!gameRunning) return;
      bossSpawning = false;
      showBoss(spawnEnemy(bossIdx), bossIdx);
    }, 3000);
    return;
  }

  const bossIdx = BOSS_WAVES[num];
  if (bossIdx !== undefined) {
    const msgs = {
      4: '⚠️ BOSS VORTEX SE APROXIMA! ⚠️',
      5: '🌌 O VAZIO ABSORVE A REALIDADE: VOID! 🌌',
      6: 'RONALDO ENTROU EM CAMPO! IMPOSSÍVEL DE PARAR!',
    };
    addLog(msgs[bossIdx], bossIdx === 6 ? 'gold' : 'danger');
    alternarMusica(musicaBoss);
    showBoss(spawnEnemy(bossIdx), bossIdx);
    return;
  }

  // Normal wave
  const count = 3 + num * 2;
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    let typeIdx;
    if      (num >= 3 && r < 0.15) typeIdx = 3; // Gandalf
    else if (num >= 2 && r < 0.25) typeIdx = 1; // Bruto
    else if (r < 0.45)             typeIdx = 2; // Gnomo
    else                           typeIdx = 0; // Makako
    setTimeout(() => {
      if (gameRunning && waveNum === num) spawnEnemy(typeIdx);
    }, i * 300);
  }
  addLog(`— wave ${num} iniciada —`, 'info');
}

function showBoss(e, bossIdx) {
  activeBoss = e;
  bossNameEl.textContent = BOSS_NAMES[bossIdx];
  bossNameEl.className   = bossIdx === 6 ? 'ronaldo-name' : '';
  bossHpFill.className   = bossIdx === 6 ? 'ronaldo-fill' : '';
  bossHpFill.style.width = '100%';
  bossHud.style.display  = 'flex';
}

function checkWaveClear() {
  if (enemies.some(e => e.alive) || waveClear || bossSpawning) return;
  waveClear = true;
  if (waveNum < MAX_WAVES[gameMode]) {
    waveNum++;
    addLog('onda limpa! próxima em 2s...', 'info');
    setTimeout(() => { if (gameRunning) spawnWave(waveNum); }, 2000);
  } else {
    endGame(true);
  }
}

// LOGS E FLOATERS
function updateHud() {
  hpFill.style.width = Math.max(0, P.hp / P.maxHp * 100) + '%';
  hpVal.textContent  = Math.max(0, P.hp);
  xpFill.style.width = (P.xp / P.xpNext * 100) + '%';
}

function clampPos(obj, size) {
  const { width, height } = arena.getBoundingClientRect();
  obj.x = Math.max(0, Math.min(width  - size, obj.x));
  obj.y = Math.max(0, Math.min(height - size, obj.y));
}

function addLog(msg, cls = '') {
  logLines.push({ msg, cls });
  if (logLines.length > 4) logLines.shift();
  logEl.innerHTML = logLines.map(l => `<div class="log-line ${l.cls}">${l.msg}</div>`).join('');
}
if(isMobile) {
  addLog('Controles: toque para mover, toque duplo para dash, atire automaticamente', 'info');
}
function floater(x, y, text, color = 'var(--accent)') {
  const f = document.createElement('div');
  f.className = 'floater';
  f.style.cssText = `left:${x - 10}px;top:${y - 10}px;color:${color}`;
  f.textContent = text;
  arena.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

// GAME LOOP
function update(dt) {
  if (!gameRunning) return;
  updatePlayer(dt);
  if (!gameRunning) return;
  updateEnemies(dt);
  if (!gameRunning) return;
  updateBullets(dt);
  if (!gameRunning) return;
  checkWaveClear();
}

function loop(ts) {
  const dt = ts - lastTime;
  lastTime = ts;
  update(Math.min(dt, 50));
  if (gameRunning) animId = requestAnimationFrame(loop);
}

// CONTROLE DE JOGO
function endGame(win) {
  gameRunning = false;
  cancelAnimationFrame(animId);
  if(musicaAtual) {
    musicaAtual.pause();
    musicaAtual.currentTime = 0;
    musicaAtual = null;
  }
  overlay.className = 'show ' + (win ? 'win' : 'gameover');
  overlayTitle.textContent = win ? 'VITÓRIA' : 'GAME OVER';
  overlaySub.textContent = win
    ? `ondas completadas · ${P.kills} inimigos · Lv.${P.level}`
    : `chegou até a wave ${waveNum} · ${P.kills} kills · Lv.${P.level}`;
}

function startGame(mode) {
  gameMode = mode;
  document.getElementById('menu').style.display = 'none';
  restartGame();
}

function restartGame() {
  cancelAnimationFrame(animId);
  enemies.forEach(e => e.el.remove());
  bullets.forEach(b => b.el.remove());
  enemies = []; bullets = []; keys = {};
  waveNum = gameMode === 'bossrush' ? 1 : 0;
  waveClear = false; bossSpawning = false;
  logLines.length = 0; logEl.innerHTML = '';
  overlay.className = '';
  atkVal.textContent = 20; killVal.textContent = 0; levelTag.textContent = 'Lv.1';
  bossHud.style.display = 'none'; activeBoss = null;
  initPlayer();
  updateHud();
  alternarMusica(gameMode === 'bossrush' ? musicaBoss : musicaNormal);
  if (gameMode === 'bossrush') {
    addLog('BOSS RUSH! Enfrente os 3 bosses!', 'danger');
    spawnWave(1);
  } else {
    spawnWave(0);
  }
  gameRunning = true;
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
}

function voltarMenu() {
  overlay.className = '';
  document.getElementById('menu').style.display = 'flex';
}

// INPUT
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ', 'w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k))
    e.preventDefault();
  if (k === ' ' || k === 'j') playerShoot();
  if (k === 'shift') playerDash();
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
</script>
